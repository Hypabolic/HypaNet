<section class="settings">
  <header>
    <p class="eyebrow">Account</p>
    <h2>Profile</h2>
    <p class="subtitle">Update your profile details here.</p>
  </header>
  <form>
    <label for="name">Display name</label>
    <input id="name" placeholder="Display name">

    <label for="postcode">Postcode</label>
    <input id="postcode" placeholder="e.g. SW1A 1AA">
    <p class="helper">Enter your postcode</p>

    <label for="email">Billing email</label>
    <input id="email" type="email">
    <p class="helper">Invoices and receipts go to this address.</p>

    <button type="submit">Save profile</button>
    <span class="sr-only">Saving can take a few seconds</span>
  </form>
</section>
