[project]
name = "agent-loop-lab"
version = "0.2.0"
description = "Agent doom-loop detector: direct weight programming experiment (spec v0.2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "numpy>=1.26,<2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
agent-loop-lab = "agent_loop_lab.inspect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
